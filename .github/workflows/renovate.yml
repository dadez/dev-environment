name: Renovate

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configuration: |
            {
              "autodiscover": true,
              "enabledManagers": ["dockerfile", "docker-compose", "github-actions", "docker"],
              "packageRules": [
                {
                  "matchDatasources": ["docker"],
                  "matchPackageNames": ["ghcr.io/your-username/your-repo"],
                  "enabled": true
                }
              ]
            }
