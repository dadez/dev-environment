name: Renovate

on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_GIT_AUTHOR: "Renovate Bot <dadez@pm.me>"
          RENOVATE_REPOSITORIES: dadez/dev-environment
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
