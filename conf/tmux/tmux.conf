# force terminal in tmux sessions in alacritty
# only this line might not be enough
set -g default-terminal "tmux-256color"
# Needs this line also to overrides the default color
# set-option -ga terminal-overrides ",xterm-256color:RBG"
set -ag terminal-overrides ",xterm-256color:RGB"

# Make mouse useful in copy mode
setw -g mouse on

# Allow mouse to select which pane to use
#set -g mouse-select-pane on

# Allow xterm titles in terminal window, terminal scrolling with scrollbar, and setting overrides of C-Up, C-Down, C-Left, C-Right
#set -g terminal-overrides "xterm*:XT:smcup@:rmcup@:kUP5=\eOA:kDN5=\eOB:kLFT5=\eOD:kRIT5=\eOC"

# Scroll History
set -g history-limit 30000

# Set ability to capture on start and restore on exit window data when running an application
#setw -g alternate-screen on

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
#set -s escape-time 50
set-option -sg escape-time 10

# bindings
# change default prefix to CTRL+a
set-option -g prefix C-a
bind-key C-a send-prefix

# copy / paste
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "bash -c 'command -v wl-copy >/dev/null && wl-copy || xclip -i -f -selection primary | xclip -i -selection clipboard'"
set-option -s set-clipboard off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "bash -c 'command -v wl-copy >/dev/null && wl-copy || xclip -i -f -selection primary | xclip -i -selection clipboard'"

# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# open panes in current directory
bind '-' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# popups
bind C-p display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80%

## workaroud for yazi https://yazi-rs.github.io/docs/image-preview/#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
bind C-e display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "yazi"

# reload tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded!"

# nvim checkhealth recommendations
set-option -g focus-events on

# start numbering of windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# # Optional: Show GPG_TTY and SSH agent in status bar
# set -g status-right "GPG: #(echo \$GPG_TTY | sed 's/.*\///') | SSH: #(basename \$SSH_AUTH_SOCK) | %Y-%m-%d %H:%M"

# ensure GPG_TTY is set in each pane and window
set -g update-environment "GPG_TTY SSH_AUTH_SOCK DISPLAY XAUTHORITY"
set-hook -g pane-focus-in 'run-shell "tmux refresh-client -S"'


